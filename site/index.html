<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unassigned</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#141019;color:#f6f1e7;margin:0;min-height:100vh;display:flex;
    align-items:center;justify-content:center;text-align:center;padding:24px}
  .seal{width:88px;height:88px;margin:0 auto 22px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#d8323f,#b0202b 42%,#7c1620);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(124,22,32,.4),inset 0 -4px 8px rgba(0,0,0,.32)}
  .seal span{font-family:Georgia,serif;font-size:30px;color:#f6e3cb;font-weight:700;transform:rotate(-9deg);letter-spacing:-1px}
  h1{font-weight:400;font-size:30px;margin:0 0 8px}
  .ok{color:#7ac77a;font-weight:600;margin:0 0 18px}
  p{color:#b9afa0;line-height:1.6;font-size:15px;max-width:360px;margin:0 auto}
  code{background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
  <div>
    <div class="seal"><span>UA</span></div>
    <h1>Unassigned</h1>
    <p class="ok">● Backend running</p>
    <p>Anonymous link sharing. Endpoints:<br>
      <code>/api/signup</code> · <code>/api/seal-and-send</code> · <code>/api/twilio-webhook</code>
    </p>
  </div>
</body>
</html>
